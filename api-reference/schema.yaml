components:
  schemas:
    Area:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name_ar:
          type: string
          maxLength: 200
        name_en:
          type: string
          maxLength: 200
        district:
          type: string
          maxLength: 50
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,15})?$
          nullable: true
        long:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,15})?$
          nullable: true
        maps_link:
          type: string
          nullable: true
          maxLength: 200
        code:
          type: string
          readOnly: true
        is_external:
          type: boolean
        tags:
          type: string
          readOnly: true
        area_group:
          allOf:
          - $ref: '#/components/schemas/AreaGroupReference'
          readOnly: true
          nullable: true
      required:
      - area_group
      - code
      - id
      - tags
    AreaGroupReference:
      type: object
      description: Minimal serializer for area_group reference in Area.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    CreateExternalArea:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        name:
          type: string
          maxLength: 200
      required:
      - lat
      - lng
      - name
    CreateOrderSerializerDocs:
      type: object
      properties:
        reference_id:
          type: string
          default: ''
          description: Reference ID of the order, for internal tracking by the shop.
        is_critical:
          type: boolean
          default: false
          description: Mark the order as critical for prioritized handling (subject
            to the delivery company load and availability)
        is_exchange:
          type: boolean
          default: false
          description: ('Require pickup of a return package upon delivery.\n', 'This
            option is only applicable when workflow is STANDARD')
        workflow:
          allOf:
          - $ref: '#/components/schemas/WorkflowEnum'
          default: STANDARD
          description: |-
            Order workflow: STANDARD or RETURN.

            * `STANDARD` - STANDARD
            * `RETURN` - RETURN
        merchant_location:
          type: integer
          description: ("Unique identifier of the merchant's location.\n", 'This identifier
            should correspond to one of the pickup locations visible on the pickup
            locations page on Parcel Tracer.')
        customer:
          allOf:
          - $ref: '#/components/schemas/CustomerDocs'
          description: |-
            Customer object for the order.
            - Provide 'id' to identify an existing customer (other fields update the record).
            - Otherwise provide 'phone_number' plus required customer fields to create a new customer.
        customer_location:
          allOf:
          - $ref: '#/components/schemas/CustomerLocationDocs'
          description: |-
            Customer location for delivery or pickup.
            - Provide 'id' to identify an existing location (other fields update it).
            - Otherwise, provide full location details to create a new location.
        cod:
          type: array
          items:
            type: array
            items:
              type: string
            maxItems: 2
            minItems: 2
          description: 'Total amount to be collected upon delivery (or upon return).
            Example: [[''USD'', ''123.5'']]'
        number_of_packages:
          type: integer
          default: 1
          description: ('Number of packages in the order.\n', 'Should be greater than
            or equal to 1.')
        description:
          type: string
          description: Optional description of the order contents.
        notes:
          type: string
          description: Extra notes about the order, visible to delivery company, carriers
            and customers.
        return_reason:
          type: string
          description: Applicable if the order is a return. Reason for the return.
      required:
      - customer
      - customer_location
      - merchant_location
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        phone_number:
          type: string
        secondary_phone_number:
          type: string
        email:
          type: string
          format: email
      required:
      - id
      - name
      - phone_number
    CustomerDocs:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          description: Unique ID of the customer. If provided, other fields are optional
            and update the customer.
        phone_number:
          type: string
          description: Customer phone number. Required if 'id' is not provided.
        secondary_phone_number:
          type: string
          description: Secondary customer phone number.
        name:
          type: string
          description: Customer full name. Required if creating a new customer.
        email:
          type: string
          format: email
          description: Customer email.
    CustomerLocationDocs:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          description: Unique ID of the location. If provided, other fields update
            this location.
        area:
          allOf:
          - $ref: '#/components/schemas/Area'
          description: City of the location.
        directions:
          type: string
          description: Additional indications to help the carrier reach the customer.
    ErrorResponse:
      type: object
      properties:
        error:
          type: boolean
        message:
          type: string
        details: {}
      required:
      - details
      - error
      - message
    ExternalArea:
      type: object
      description: Lightweight serializer for external API — no tags, no N+1 queries.
      properties:
        id:
          type: integer
        name_ar:
          type: string
        name_en:
          type: string
        district:
          type: string
        code:
          type: string
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,15})?$
        long:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,15})?$
      required:
      - code
      - district
      - id
      - lat
      - long
      - name_ar
      - name_en
    ExternalInvoice:
      type: object
      description: A merchant invoice and its orders, for reconciliation by the merchant's
        systems.
      properties:
        number:
          type: integer
        status:
          type: string
        issued_at:
          type: string
          format: date-time
        cod:
          type: array
          items:
            type: array
            items:
              type: string
            minItems: 2
            maxItems: 2
          readOnly: true
        delivery_fee:
          type: array
          items:
            type: array
            items:
              type: string
            minItems: 2
            maxItems: 2
          readOnly: true
        net_due_to_merchant:
          type: array
          items:
            type: array
            items:
              type: string
            minItems: 2
            maxItems: 2
          readOnly: true
        orders:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceOrder'
      required:
      - cod
      - delivery_fee
      - issued_at
      - net_due_to_merchant
      - number
      - orders
      - status
    ExternalInvoiceListItem:
      type: object
      description: |-
        Invoice metadata for listing and grouping, without the per-order breakdown.

        order_count is read from an `order_count` annotation on the queryset, and the money
        totals come from the cached MoneyAmount purposes, so the listing queryset must both
        annotate the count and prefetch `money_amounts` to avoid a query per invoice.
      properties:
        number:
          type: integer
        status:
          type: string
        status_display:
          type: string
        issued_at:
          type: string
          format: date-time
        order_count:
          type: integer
        cod:
          type: array
          items:
            type: array
            items:
              type: string
            minItems: 2
            maxItems: 2
          readOnly: true
        delivery_fee:
          type: array
          items:
            type: array
            items:
              type: string
            minItems: 2
            maxItems: 2
          readOnly: true
        net_due_to_merchant:
          type: array
          items:
            type: array
            items:
              type: string
            minItems: 2
            maxItems: 2
          readOnly: true
      required:
      - cod
      - delivery_fee
      - issued_at
      - net_due_to_merchant
      - number
      - order_count
      - status
      - status_display
    ExternalLocation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        area:
          $ref: '#/components/schemas/Area'
        directions:
          type: string
      required:
      - area
      - id
    IntegrationItemDocs:
      type: object
      properties:
        name:
          type: string
          description: 'Line item name, e.g. ''T-Shirt (Size: M)''.'
        quantity:
          type: integer
          description: Quantity ordered.
        price:
          type: string
          description: Unit price as a string, e.g. '19.99'.
        currency:
          type: string
          description: ISO currency code, e.g. 'USD'.
        image_url:
          type: string
          description: Image of the item on the source platform.
        source_url:
          type: string
          description: Link to the item on the source platform.
      required:
      - name
    InvoiceOrder:
      type: object
      description: 'An invoice line: one order with the financial figures needed to
        reconcile it.'
      properties:
        order_id:
          type: string
        reference_id:
          type: string
        workflow:
          type: string
        delivery_state:
          type: string
        payment_state:
          type: string
        cod:
          type: array
          items:
            type: array
            items:
              type: string
            maxItems: 2
            minItems: 2
          description: Amount to collect from the customer on delivery, e.g. [['USD','20.00']].
        delivery_fee:
          type: array
          items:
            type: array
            items:
              type: string
            maxItems: 2
            minItems: 2
          description: The courier's delivery charge.
      required:
      - cod
      - delivery_fee
      - delivery_state
      - order_id
      - payment_state
      - reference_id
      - workflow
    ModeEnum:
      enum:
      - OPEN
      - CLOSED
      - SCHEDULE
      type: string
      description: |-
        * `OPEN` - Open
        * `CLOSED` - Closed
        * `SCHEDULE` - Schedule
    OrdersListDocs:
      type: object
      properties:
        order_id:
          type: string
          description: Unique order identifier, auto-generated by Parcel Tracer (e.g.
            '11').
        reference_id:
          type: string
          description: Reference ID of the order, for internal tracking by the shop.
        is_critical:
          type: boolean
          description: Mark the order as critical for prioritized handling (subject
            to the delivery company load and availability)
        is_exchange:
          type: boolean
          description: ('Require pickup of a return package upon delivery.\n', 'This
            option is only applicable when workflow is STANDARD')
        workflow:
          allOf:
          - $ref: '#/components/schemas/WorkflowEnum'
          description: |-
            Order workflow: STANDARD or RETURN.

            * `STANDARD` - STANDARD
            * `RETURN` - RETURN
        merchant_location:
          type: integer
          description: ("Unique identifier of the merchant's location.\n", 'This identifier
            should correspond to one of the pickup locations visible on the pickup
            locations page on Parcel Tracer.')
        customer:
          allOf:
          - $ref: '#/components/schemas/Customer'
          description: Customer object for the order.
        customer_location:
          allOf:
          - $ref: '#/components/schemas/ExternalLocation'
          description: Customer location for delivery or pickup.
        cod:
          type: array
          items:
            type: array
            items:
              type: string
            maxItems: 2
            minItems: 2
          description: 'Total amount to be collected upon delivery (or upon return).
            Example: [[''USD'', ''123.5'']]'
        delivery_fee:
          type: array
          items:
            type: array
            items:
              type: string
            maxItems: 2
            minItems: 2
          description: 'Total amount charged for the delivery operation. Required
            only if workflow is STANDARD. Example: [[''USD'', ''123.5'']]'
        number_of_packages:
          type: integer
          description: ('Number of packages in the order.\n', 'Should be greater than
            or equal to 1.')
        description:
          type: string
          description: Optional description of the order contents.
        notes:
          type: string
          description: Extra notes about the order, visible to delivery company, carriers
            and customers.
        payment_state:
          allOf:
          - $ref: '#/components/schemas/PaymentStateEnum'
          description: |-
            Payment state of the order.

            * `UNPAID` - UNPAID
            * `PENDING_PAYMENT_BY_DRIVER` - PENDING_PAYMENT_BY_DRIVER
            * `PAID_BY_DRIVER` - PAID_BY_DRIVER
            * `PENDING_PAYMENT_TO_MERCHANT` - PENDING_PAYMENT_TO_MERCHANT
            * `PAID_TO_MERCHANT` - PAID_TO_MERCHANT
        return_reason:
          type: string
          description: Applicable if the order is a return. Reason for the return.
        tracking_link:
          type: string
          format: uri
          description: Publicly accessible link to track the order's delivery journey.
        order_url:
          type: string
          format: uri
          description: Link to the order in the merchant's Parcel Tracer dashboard.
        delivery_state:
          type: string
          description: 'Current delivery state of the order. One of: CREATED, PICKUP_REQUESTED,
            PICKUP_ASSIGNED, SCANNED_FOR_PICKUP, PICKED_UP, AT_WAREHOUSE, DELIVERY_ASSIGNED,
            SCANNED_FOR_DELIVERY, PICKED_UP_FOR_DELIVERY, IN_TRANSIT, DELIVERED, AWAITING_RETURN,
            CANCELLED, DELIVERED_AT_WAREHOUSE.'
        merchant_invoice:
          type: integer
          nullable: true
          description: Identifier of the merchant invoice this order was billed on,
            or null if not yet invoiced.
        integration_items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationItemDocs'
          description: Structured line items from an integrated platform (e.g. Shopify/WooCommerce).
        source_url:
          type: string
          description: Link back to the order on the originating platform.
        statestamps:
          type: array
          items:
            $ref: '#/components/schemas/StatestampDocs'
          description: Chronological history of the order's delivery and payment states.
      required:
      - cod
      - customer
      - customer_location
      - delivery_state
      - description
      - is_critical
      - is_exchange
      - merchant_location
      - notes
      - number_of_packages
      - order_id
      - order_url
      - payment_state
      - reference_id
      - statestamps
      - tracking_link
      - workflow
    PaginatedCustomerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
    PaginatedExternalInvoiceListItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExternalInvoiceListItem'
    PaginatedExternalLocationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExternalLocation'
    PaginatedOrdersListDocsList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrdersListDocs'
    PatchedCustomer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        phone_number:
          type: string
        secondary_phone_number:
          type: string
        email:
          type: string
          format: email
    PatchedExternalLocation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        area:
          $ref: '#/components/schemas/Area'
        directions:
          type: string
    PatchedPatchOrderSerializerDocs:
      type: object
      properties:
        reference_id:
          type: string
          description: Reference ID of the order, for internal tracking by the shop.
        is_critical:
          type: boolean
          description: Mark the order as critical for prioritized handling.
        cod:
          type: array
          items:
            type: array
            items:
              type: string
            maxItems: 2
            minItems: 2
          description: |-
            Cash-on-delivery amount to collect upon delivery in case of STANDARD delivery, or to be paid by shop on return for RETURN orders.Format: [['USD', '123.5']].

            Can only be modified if:
            - Workflow is 'STANDARD', or
            - Workflow is 'RETURN' **and** the delivery state is 'CREATED'.
        number_of_packages:
          type: integer
          description: Number of packages in the order.
        description:
          type: string
          description: Optional description of the order contents.
        notes:
          type: string
          description: Customer-visible notes about the order.
        return_reason:
          type: string
          description: Applicable if the order is a return. Reason for the return.
    PaymentStateEnum:
      enum:
      - UNPAID
      - PENDING_PAYMENT_BY_DRIVER
      - PAID_BY_DRIVER
      - PENDING_PAYMENT_TO_MERCHANT
      - PAID_TO_MERCHANT
      type: string
      description: |-
        * `UNPAID` - UNPAID
        * `PENDING_PAYMENT_BY_DRIVER` - PENDING_PAYMENT_BY_DRIVER
        * `PAID_BY_DRIVER` - PAID_BY_DRIVER
        * `PENDING_PAYMENT_TO_MERCHANT` - PENDING_PAYMENT_TO_MERCHANT
        * `PAID_TO_MERCHANT` - PAID_TO_MERCHANT
    ProfileResponse:
      type: object
      properties:
        organisation_name:
          type: string
        brand:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
        primary_color:
          type: string
      required:
      - brand
      - logo_url
      - organisation_name
      - primary_color
    ResolveCoordinatesRequest:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
      required:
      - lat
      - lng
    ResolveCoordinatesResponse:
      type: object
      properties:
        resolved_area:
          allOf:
          - $ref: '#/components/schemas/ResolvedArea'
          nullable: true
      required:
      - resolved_area
    ResolvedArea:
      type: object
      properties:
        id:
          type: integer
        name_en:
          type: string
        district:
          type: string
        distance_km:
          type: number
          format: double
          description: Distance in km from the given coordinates to the area centre.
        lat:
          type: number
          format: double
          description: Latitude of the matched area.
        lng:
          type: number
          format: double
          description: Longitude of the matched area.
        delivery_fee_delta:
          type: string
          nullable: true
          description: Extra delivery fee (in USD) applied for this area by the merchant's
            delivery fee rules, or null if no rule applies.
      required:
      - delivery_fee_delta
      - distance_km
      - district
      - id
      - lat
      - lng
      - name_en
    Response:
      type: object
      description: |-
        Detected area object based on provided address.

        AI is used to resolve the provided address and detect the geographic area.

        ATTENTION: Area detection will fail if the address is unclear or not specific enough.
      properties:
        id:
          type: integer
          readOnly: true
        name_ar:
          type: string
          maxLength: 200
        name_en:
          type: string
          maxLength: 200
        district:
          type: string
          maxLength: 50
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,15})?$
          nullable: true
        long:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,15})?$
          nullable: true
        maps_link:
          type: string
          nullable: true
          maxLength: 200
        code:
          type: string
          readOnly: true
        is_external:
          type: boolean
        tags:
          type: string
          readOnly: true
        area_group:
          allOf:
          - $ref: '#/components/schemas/AreaGroupReference'
          readOnly: true
          nullable: true
      required:
      - area_group
      - code
      - id
      - tags
    ShopLocationSerializerForMerchant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        address:
          type: string
          nullable: true
          maxLength: 400
        contact_person:
          type: string
          maxLength: 200
        contact_phone:
          type: string
          maxLength: 200
        merchant:
          type: integer
          readOnly: true
        district:
          type: string
          nullable: true
          maxLength: 50
        governorate:
          type: string
          nullable: true
          maxLength: 50
        city:
          type: string
          maxLength: 200
        directions:
          type: string
          maxLength: 400
        is_default:
          type: boolean
        area:
          $ref: '#/components/schemas/Area'
        mode:
          $ref: '#/components/schemas/ModeEnum'
        opening_hours:
          nullable: true
        utc_offset:
          type: integer
          maximum: 840
          minimum: -720
        is_open:
          type: string
          readOnly: true
        is_active:
          type: boolean
      required:
      - id
      - is_open
      - merchant
    StatestampDocs:
      type: object
      properties:
        delivery_state:
          type: string
          description: Delivery state recorded at this point in time.
        payment_state:
          type: string
          description: Payment state recorded at this point in time.
        timestamp:
          type: string
          format: date-time
          description: When the order entered this state.
      required:
      - delivery_state
      - payment_state
      - timestamp
    WorkflowEnum:
      enum:
      - STANDARD
      - RETURN
      type: string
      description: |-
        * `STANDARD` - STANDARD
        * `RETURN` - RETURN
  securitySchemes:
    MerchantAPIKey:
      type: apiKey
      in: header
      name: X-Api-Key
servers:
- url: https://api.parceltracer.com/v1/external/
  description: Parcel Tracer api endpoint
