                          id: 6640
                          area:
                            id: 55
                            name_ar: بلدي
                            name_en: Balde
                            district: Akkar
                            lat: '34.560760000000000'
                            long: '36.144910000000000'
                            maps_link: http://maps.google.com/maps?q=34.56076,36.14491
                            code: LBN0055
                            is_external: false
                            area_group: null
                          directions: ''
                  summary: A page of orders.
          description: ''
    post:
      operationId: create_order
      description: |-
        Create a new order with customer and location details.

        - If `customer.id` is provided, an existing customer is updated.
        - If only `phone_number` is provided, a customer is looked up or created.
        - `customer_location.id` works similarly, but must belong to the customer.
        - `cod` is a list of currency/amount pairs. Example: [['USD', '10'], ['LBP', '1000000']]
      summary: Create order
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderSerializerDocs'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateOrderSerializerDocs'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateOrderSerializerDocs'
        required: true
      security:
      - MerchantAPIKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersListDocs'
              examples:
                SuccessfulOrderCreation:
                  value:
                    order_id: '179'
                    reference_id: '123'
                    is_exchange: false
                    workflow: STANDARD
                    tracking_link: https://prod.parceltracer.app/tracking/9kQz2Lp4x
                    order_url: https://acme.parceltracer.app/order/79
                    is_critical: true
                    merchant_location: 1
                    cod:
                    - - LBP
                      - '2000000.00'
                    - - USD
                      - '50.50'
                    delivery_fee:
                    - - USD
                      - '3.00'
                    number_of_packages: 1
                    description: '2x T-Shirt (Size: M)'
                    notes: ''
                    return_reason: ''
                    delivery_state: CREATED
