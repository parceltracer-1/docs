openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /areas/:
    get:
      operationId: list_areas
      description: Retrieve all available areas.
      summary: List Avaialable Areas
      tags:
      - Areas
      security:
      - MerchantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalArea'
              examples:
                Areas:
                  value:
                  - - id: 146
                      name_ar: عيناب
                      name_en: Ainab
                      district: Aley
                      code: LBN0146
                      lat: '33.766414000000000'
                      long: '35.546311000000000'
                    - id: 161
                      name_ar: بخشتاي
                      name_en: Bkhechtey
                      district: Aley
                      code: LBN0161
                      lat: '33.799487000000000'
                      long: '35.615519000000000'
                  summary: A sample list of areas
          description: ''
  /areas/create/:
    post:
      operationId: create_external_area
      description: Create an external area from coordinates. Used when no internal
        area matches.
      summary: Create External Area
      tags:
      - Areas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalArea'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateExternalArea'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateExternalArea'
        required: true
      security:
      - MerchantAPIKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
          description: ''
  /customers/:
    get:
      operationId: list_customers
      description: Retrieve a paginated list of customers.
      summary: List customers
      parameters:
      - in: query
        name: include_locations
        schema:
          type: boolean
          default: false
        description: If true, includes locations data for each customer.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: phone_number
        schema:
          type: string
          default: ''
        description: Filter result by a specific phone number. Given that customer's
          phone numbers are unique, the result will contain at most a single customer
          object
      tags:
      - Customers
      security:
      - MerchantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerList'
              examples:
                CustomerListExample:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 2
                      next: null
                      previous: null
                      results:
                      - id: 1
                        name: John Doe
                        phone_number: '+1234567890'
                        secondary_phone_number: ''
                        email: john@example.com
                        locations:
                        - id: 10
                          area:
                            id: 12
                            name_ar: عيات
                            name_en: Aaiyat
                            district: Akkar
                            lat: '34.535340000000000'
                            long: '36.196820000000000'
                            maps_link: http://maps.google.com/maps?q=34.53534,36.19682
                            code: LBN0012
                            is_external: false
                            area_group: null
                          directions: ''
                      - id: 2
                        name: Jane Smith
                        phone_number: '+1987654321'
                        secondary_phone_number: ''
                        email: jane@example.com
                        locations: []
                  summary: A page of customers (with ?include_locations=true)
          description: ''
    post:
      operationId: create_customer
      description: Create a new customer using the customer's unique phone number.
      summary: Create customer
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Customer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Customer'
        required: true
      security:
      - MerchantAPIKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                CustomerCreatedSuccessfully:
                  value:
                    id: 9721
                    name: Yasser
                    phone_number: '+9617322112'
                    secondary_phone_number: ''
                    email: yasser@email.com
                  summary: Example of resource created successfully
          description: Successful creation
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  value:
                    error: 'true'
                    message: Validation failed.
                    details: 'phone_number: This field is required.'
                  summary: Example of validation error response
          description: Validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ServerError:
                  value:
                    error: 'true'
                    message: Unexpected error.
                    details: Internal server error
                  summary: Example of internal server error response
          description: Server error
  /customers/{customer_pk}/locations/:
    get:
      operationId: list_customer_locations
      description: Retrieve all locations associated with the given customer.
      summary: List customer locations
      parameters:
      - in: path
        name: customer_pk
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Customer Locations
      security:
      - MerchantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExternalLocationList'
              examples:
                CustomerLocationsExample:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 2
                      next: null
                      previous: null
                      results:
                      - id: 9688
                        area:
                          id: 146
                          name_ar: عيناب
                          name_en: Ainab
                          district: Aley
                          lat: '33.766414000000000'
                          long: '35.546311000000000'
                          maps_link: http://maps.google.com/maps?q=33.766414,35.546311
                          code: LBN0146
                          is_external: false
                          area_group: null
                        directions: ''
                      - id: 9689
                        area:
                          id: 161
                          name_ar: بخشتاي
                          name_en: Bkhechtey
                          district: Aley
                          lat: '33.799487000000000'
                          long: '35.615519000000000'
                          maps_link: http://maps.google.com/maps?q=33.799487,35.615519
                          code: LBN0161
                          is_external: false
                          area_group: null
                        directions: Near the pharmacy
                  summary: A page of customer locations
          description: ''
    post:
      operationId: create_customer_location
      description: Create a new location for the specified customer.
      summary: Create customer location
      parameters:
      - in: path
        name: customer_pk
        schema:
          type: integer
        required: true
      tags:
      - Customer Locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalLocation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExternalLocation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExternalLocation'
        required: true
      security:
      - MerchantAPIKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalLocation'
              examples:
                LocationCreatedSuccessfully:
                  value:
                    id: 9691
                    area:
                      id: 146
                      name_ar: عيناب
                      name_en: Ainab
                      district: Aley
                      lat: '33.766414000000000'
                      long: '35.546311000000000'
                      maps_link: http://maps.google.com/maps?q=33.766414,35.546311
                      code: LBN0146
                      is_external: false
                      area_group: null
                    directions: ''
                  summary: Example of resource created successfully
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  value:
                    error: 'true'
                    message: Validation failed.
                    details: 'district: Beiruts is not a valid choice.'
                  summary: Example of validation error response
          description: Validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ServerError:
                  value:
                    error: 'true'
                    message: Unexpected error.
                    details: Internal server error
                  summary: Example of internal server error response
          description: Server error
  /customers/{customer_pk}/locations/{location_pk}/:
    get:
      operationId: retrieve_customer_location
      description: Retrieve the details of a specific customer location.
      summary: Retrieve customer location
      parameters:
      - in: path
        name: customer_pk
        schema:
          type: integer
        required: true
      - in: path
        name: location_pk
        schema:
          type: integer
        required: true
      tags:
      - Customer Locations
      security:
      - MerchantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalLocation'
              examples:
                LocationRetrieved:
                  value:
                    id: 9691
                    area:
                      id: 146
                      name_ar: عيناب
                      name_en: Ainab
                      district: Aley
                      lat: '33.766414000000000'
                      long: '35.546311000000000'
                      maps_link: http://maps.google.com/maps?q=33.766414,35.546311
                      code: LBN0146
                      is_external: false
                      area_group: null
                    directions: ''
                  summary: Example of resource retrieved successfully
          description: Successful retrieval
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFoundError:
                  value:
                    error: 'true'
                    message: Resource not found.
                    details: 'detail: Not found.'
                  summary: Example of resource not found error
          description: Customer location not found
    patch:
      operationId: update_customer_location
      description: Partially update an existing location associated with the specified
        customer.
      summary: Update customer location
      parameters:
      - in: path
        name: customer_pk
        schema:
          type: integer
        required: true
      - in: path
        name: location_pk
        schema:
          type: integer
        required: true
      tags:
      - Customer Locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExternalLocation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExternalLocation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExternalLocation'
      security:
      - MerchantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalLocation'
              examples:
                LocationUpdatedSuccessfully:
                  value:
                    id: 9691
                    area:
                      id: 146
                      name_ar: عيناب
                      name_en: Ainab
                      district: Aley
                      lat: '33.766414000000000'
                      long: '35.546311000000000'
                      maps_link: http://maps.google.com/maps?q=33.766414,35.546311
                      code: LBN0146
                      is_external: false
                      area_group: null
                    directions: ''
                  summary: Example of resource created successfully
          description: Successful update
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFoundError:
                  value:
                    error: 'true'
                    message: Resource not found.
                    details: 'detail: Not found.'
                  summary: Example of resource not found error
          description: Customer location not found
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  value:
                    error: 'true'
                    message: Validation failed.
                    details: 'district: Beiruts is not a valid choice.'
                  summary: Example of validation error response
          description: Validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ServerError:
                  value:
                    error: 'true'
                    message: Unexpected error.
                    details: Internal server error
                  summary: Example of internal server error response
          description: Server error
  /customers/{id}/:
    get:
      operationId: retrieve_customer
      description: Retrieve the details of a specific customer by ID.
      summary: Retrieve customer
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: include_locations
        schema:
          type: boolean
          default: false
        description: If true, includes customer locations in the response.
      tags:
      - Customers
      security:
      - MerchantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                CustomerRetrieved:
                  value:
                    id: 9721
                    name: Yasser
                    phone_number: '+9617322112'
                    secondary_phone_number: ''
                    email: yasser@email.com
                  summary: Example of resource retrieved successfully
          description: Successful retrieval
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                NotFoundError:
                  value:
                    error: 'true'
                    message: Resource not found.
                    details: 'detail: Not found.'
                  summary: Example of resource not found error
          description: Customer not found
    patch:
      operationId: partial_update_customer
      description: Update the details of a customer.
      summary: Update customer
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomer'
      security:
      - MerchantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                CustomerCreatedSuccessfully:
                  value:
                    id: 9721
                    name: Joe
                    phone_number: '+9617322112'
                    secondary_phone_number: ''
                    email: joe@email.com
                  summary: Example of resource created successfully
          description: Successful patch
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFoundError:
                  value:
                    error: 'true'
                    message: Resource not found.
                    details: 'detail: Not found.'
                  summary: Example of resource not found error
          description: Customer not found
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  value:
                    error: 'true'
                    message: Validation failed.
                    details: 'phone_number: This field is required.'
                  summary: Example of validation error response
          description: Validation failure
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ServerError:
                  value:
                    error: 'true'
                    message: Unexpected error.
                    details: Internal server error
                  summary: Example of internal server error response
          description: Server error
  /invoices/:
    get:
      operationId: list_invoices
      description: |-
        Retrieve a paginated list of the merchant's invoices, newest first, each with a financial summary (COD, delivery fee, net due to merchant), its status, and the number of orders on it. This returns invoice metadata only, for building a grouped overview; use the retrieve endpoint to get the orders on a specific invoice.

        Use the `year` and `month` filters to fetch the invoices issued in a single period.
      summary: List merchant invoices
      parameters:
      - in: query
        name: month
        schema:
          type: integer
        description: Return only invoices issued in this month (1-12). Combine with
          `year`.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: year
        schema:
          type: integer
        description: Return only invoices issued in this year, e.g. 2026.
      tags:
      - Invoices
      security:
      - MerchantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExternalInvoiceListItemList'
              examples:
                InvoiceListing:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - - number: 214
                        status: PAID
                        status_display: Paid
                        issued_at: '2026-07-03T09:15:00Z'
                        order_count: 12
                        cod:
                        - - USD
                          - '240.00'
                        delivery_fee:
                        - - USD
                          - '36.00'
                        net_due_to_merchant:
                        - - USD
                          - '204.00'
                      - number: 213
                        status: PENDING_PAYMENT
                        status_display: Pending Payment
                        issued_at: '2026-06-28T14:02:00Z'
                        order_count: 5
                        cod:
                        - - USD
                          - '95.00'
                        delivery_fee:
                        - - USD
                          - '15.00'
                        net_due_to_merchant:
                        - - USD
                          - '80.00'
                  summary: A page of invoice metadata, newest first.
          description: A page of invoice metadata.
  /invoices/{invoice_number}/:
    get:
      operationId: retrieve_invoice
      description: 'Retrieve a merchant invoice by its number, with its orders and
        their financial state (COD to collect from the customer, delivery fee, delivery
        state, payment state) for reconciliation. The number is the invoice id shown
        to merchants as "Invoice #{id}".'
      summary: Retrieve a merchant invoice
      parameters:
      - in: path
        name: invoice_number
        schema:
          type: integer
        required: true
      tags:
      - Invoices
      security:
      - MerchantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalInvoice'
          description: The invoice and its orders.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invoice not found.
  /orders/:
    get:
      operationId: list_orders
      description: Retrieve a paginated list of orders.
      summary: List orders
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Orders
      security:
      - MerchantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrdersListDocsList'
              examples:
                OrdersListing:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 2
                      next: null
                      previous: null
                      results:
                      - order_id: '11'
                        reference_id: ''
                        is_exchange: false
                        workflow: STANDARD
                        tracking_link: https://prod.parceltracer.app/tracking/RYp8OAHu8
                        order_url: https://acme.parceltracer.app/order/1
                        is_critical: false
                        merchant_location: 1
                        cod:
                        - - USD
                          - '20.00'
                        delivery_fee:
                        - - USD
                          - '3.00'
                        number_of_packages: 1
                        description: ''
                        notes: ''
                        return_reason: ''
                        delivery_state: CREATED
                        payment_state: UNPAID
                        merchant_invoice: null
