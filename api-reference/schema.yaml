                            long: '36.196820000000000'
                            maps_link: http://maps.google.com/maps?q=34.53534,36.19682
                            code: LBN0001
                            is_external: false
                            area_group: null
                          directions: ''
                      - order_id: '17'
                        reference_id: ''
                        is_exchange: false
                        workflow: STANDARD
                        tracking_link: https://prod.parceltracer.app/tracking/1BM0Kv0k87
                        order_url: https://acme.parceltracer.app/order/7
                        is_critical: false
                        merchant_location: 1
                        cod:
                        - - USD
                          - '20.00'
                        delivery_fee:
                        - - USD
                          - '3.00'
                        number_of_packages: 1
                        description: ''
                        notes: ''
                        return_reason: ''
                        delivery_state: CREATED
                        payment_state: UNPAID
                        merchant_invoice: null
                        integration_items: []
                        source_url: ''
                        statestamps:
                        - delivery_state: CREATED
                          payment_state: UNPAID
                          timestamp: '2026-07-22T23:04:10.112233+03:00'
                        customer:
                          id: 6636
                          name: Sara
                          phone_number: '+9613853335'
                          secondary_phone_number: ''
